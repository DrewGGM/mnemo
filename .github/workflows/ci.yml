# Stages 1 to 5 of docs/quality-baseline.md §7 for Go. Actions are pinned by
# full commit SHA, with the tag in a comment (docs/security-baseline.md §8).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # Same image and digest as the db service of docker-compose.yml.
        image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
        env:
          POSTGRES_DB: mnemo
          POSTGRES_PASSWORD: postgres_ci
        ports:
          - 5432:5432
        # Over TCP, because the image's initialization server listens only on
        # its Unix socket and would pass a socket check before restarting.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d mnemo"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      MNEMO_ADMIN_DB_PASSWORD: mnemo_admin_ci
      MNEMO_APP_DB_PASSWORD: mnemo_app_ci
      MNEMO_TEST_DATABASE_URL: postgres://mnemo_app:mnemo_app_ci@127.0.0.1:5432/mnemo?sslmode=disable
      MNEMO_TEST_ADMIN_DATABASE_URL: postgres://mnemo_admin:mnemo_admin_ci@127.0.0.1:5432/mnemo?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the toolchain directive of go.mod.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: go tool staticcheck ./...

      - name: Unit tests
        run: go test ./...

      # The service starts before checkout, so it cannot mount deploy/initdb
      # the way Compose does; the same script runs here, as the superuser,
      # because pgvector is not a trusted extension.
      - name: Create database roles
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: >-
          docker exec -i -e MNEMO_ADMIN_DB_PASSWORD -e MNEMO_APP_DB_PASSWORD "$PG_CONTAINER"
          psql -U postgres -d mnemo -v ON_ERROR_STOP=1 -f - < deploy/initdb/01-roles.sql

      - name: Integration tests
        run: go test -tags=integration ./...

      - name: archcheck
        run: go run ./tools/archcheck

      - name: depbudget
        run: go run ./tools/depbudget -max 6

      - name: govulncheck
        run: go tool govulncheck ./...

      - name: go mod verify
        run: go mod verify

      # The service must never hold the credential of the role that bypasses
      # row level security (ADR-0007, decision 2).
      - name: Service environment has no admin credential
        run: |
          docker compose config --format json | jq -e '
            (.services.mnemo // error("compose has no mnemo service")) as $svc
            | ($svc.environment // {}) as $env
            | ($env | has("MNEMO_ADMIN_DATABASE_URL") | not)
              and ([$env[] | tostring | select(contains("mnemo_admin"))] | length == 0)
          ' >/dev/null || {
            echo "::error::the environment of the mnemo service carries MNEMO_ADMIN_DATABASE_URL or a mnemo_admin value"
            exit 1
          }

      - name: Build image
        run: docker compose build

      - name: Start with Compose
        run: |
          start=$(date +%s)
          docker compose up -d --wait --wait-timeout 60
          curl -fsS --max-time 5 http://127.0.0.1:8080/readyz
          elapsed=$(( $(date +%s) - start ))
          echo "ready after ${elapsed}s"
          test "$elapsed" -lt 60

      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color

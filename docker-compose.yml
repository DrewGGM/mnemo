# Development stack. Every password here is a development default for a
# database published only on the loopback interface.
#
# Integration tests read these URLs (replace 55432 when MNEMO_DB_PORT is set):
#   MNEMO_TEST_DATABASE_URL=postgres://mnemo_app:mnemo_app_dev@127.0.0.1:55432/mnemo?sslmode=disable
#   MNEMO_TEST_ADMIN_DATABASE_URL=postgres://mnemo_admin:mnemo_admin_dev@127.0.0.1:55432/mnemo?sslmode=disable
services:
  db:
    # pgvector 0.8.7 on PostgreSQL 17.12, pinned by digest after checking it (Q-8, A-9).
    image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    environment:
      POSTGRES_DB: mnemo
      POSTGRES_PASSWORD: postgres_dev
      MNEMO_ADMIN_DB_PASSWORD: mnemo_admin_dev
      MNEMO_APP_DB_PASSWORD: mnemo_app_dev
    ports:
      - "127.0.0.1:${MNEMO_DB_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP: during initialization the image runs a temporary server that
      # listens only on its Unix socket, so this check passes once the roles exist.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "mnemo_admin", "-d", "mnemo"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:

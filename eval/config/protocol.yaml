# LongMemEval protocol (ADR-0004, docs/evaluation-plan.md). Its SHA-256 is the
# protocol id written in every result: changing any line, or the reader
# prompt it pins, means rerunning every arm (docs/evaluation-plan.md).

# Seeds dev60 and write100: stratified by question type, abstention questions
# being strata of their own. heldout440 is every question not in dev60. It
# also seeds the bootstrap intervals of the report.
seed: 20261119

# Downloaded by mnemo-eval fetch, relative to this file; never committed.
data_dir: ../data

# Hugging Face release named by https://github.com/xiaowu0162/LongMemEval,
# pinned to the dataset revision of 2025-09-19 (the cleaned histories).
datasets:
  longmemeval_s:
    url: https://huggingface.co/datasets/xiaowu0162/longmemeval-cleaned/resolve/98d7416c24c778c2fee6e6f3006e7a073259d48f/longmemeval_s_cleaned.json
    sha256: d6f21ea9d60a0d56f34a05b609c79c88a451d2ae03597821ea3d5a9678c3a442
  longmemeval_oracle:
    url: https://huggingface.co/datasets/xiaowu0162/longmemeval-cleaned/resolve/98d7416c24c778c2fee6e6f3006e7a073259d48f/longmemeval_oracle.json
    sha256: 821a2034d219ab45846873dd14c14f12cfe7776e73527a483f9dac095d38620c

# The questions of a run: the dataset above, split with the seed (--split).
questions: longmemeval_s

# Models are reached through OpenAI-compatible endpoints named by variables:
# <env>_BASE_URL and <env>_API_KEY, and <env>_MODEL, which must match when set.
# Both are asked with temperature 0.
reader:
  model: gemini-3.1-flash-lite
  env: MNEMO_LLM
  # SHA-256 of eval/src/mnemo_eval/prompts/reader.txt with LF line endings,
  # the one prompt of every arm.
  prompt_sha256: ebc67d14a4fe199420ba8875c7717a6182c138f6fa3cf63fdc48a206849064ad
# The judge of the LongMemEval paper, with the official prompts of
# evaluate_qa.py (eval/src/mnemo_eval/judge.py).
judge:
  model: gpt-4o-2024-08-06
  env: MNEMO_JUDGE

# docs/evaluation-plan.md section 3. Memory none: the question and its date;
# history: the whole history in chronological order; recall: what mnemo
# recalls with these parameters.
arms:
  B0:
    memory: none
  B1:
    memory: history
  B2:
    memory: recall
    recall:
      sources: [episodes.vector]
      max_tokens: 8000
  M:
    memory: recall
    recall:
      max_tokens: 8000

# List prices of docs/evaluation-plan.md section 4; the report prices the
# reader with them. The judge has no verified price yet (Q-2).
prices:
  date: "2026-11-19"
  source: https://aistudio.google.com/docs/pricing
  usd_per_million_tokens:
    gemini-3.1-flash-lite:
      input: 0.25
      output: 1.50

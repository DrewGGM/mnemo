[project]
name = "mnemo-eval"
version = "0.1.0"
description = "Evaluation harness for mnemo"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0.4"]

[project.scripts]
mnemo-eval = "mnemo_eval.cli:main"

[dependency-groups]
dev = ["pip-audit>=2.10.1", "pytest>=9.2.0", "ruff>=0.17.6"]

[build-system]
requires = ["uv_build>=0.11.19,<0.12"]
build-backend = "uv_build"

# mnemo_eval has no __init__.py: its modules are cli, client and pipeline.
[tool.uv.build-backend]
namespace = true

[tool.pytest.ini_options]
addopts = ["--strict-markers"]
markers = ["integration: needs the mnemo service started with docker compose up -d --wait"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "C90", "PL"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
